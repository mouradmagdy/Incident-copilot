services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: incident_copilot
      POSTGRES_USER: incident_copilot_dev
      POSTGRES_PASSWORD: incident_copilot_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_copilot_dev -d incident_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
